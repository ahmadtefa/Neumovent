<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neumovent GraphNet Advance – interactive study</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#20252d;color:#eee;font:15px Arial;display:grid;place-items:center;min-height:100vh}.device{width:min(1180px,98vw);background:linear-gradient(130deg,#e3e5e9,#b9bdc7);padding:22px;border-radius:18px;border:6px solid #777e89;box-shadow:0 16px 55px #0008}.brand{color:#343c51;font-weight:bold;font-size:23px;margin:0 0 14px}.brand small{font-size:13px;float:right}.display{background:#cbd0de;border:7px solid #626b80;border-radius:8px;padding:12px;color:#151a2d}.metrics{display:flex;justify-content:space-around;background:#091139;color:#b7f3d0;padding:10px;font-size:20px}.metrics b{color:#fff}.middle{display:grid;grid-template-columns:1.6fr 1fr;gap:9px;margin-top:10px}.waves{display:grid;gap:6px}.plot{background:#080d3d;border:1px solid #6b7b9d;height:120px;position:relative}.plot label{position:absolute;left:9px;top:7px;color:#a9e9c3;font-size:13px}canvas{width:100%;height:100%}.menu{background:#a7acba;padding:12px;min-height:370px;color:#10182e}.menu h3{margin:0 0 12px;text-align:center}.menu button{display:block;width:100%;text-align:left;margin:6px 0;background:#d7dae3;border:1px solid #666e83;padding:10px;color:#18233d;cursor:pointer}.menu button.active{background:#576f9a;color:white}.params{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}.params button{flex:1;min-width:78px;padding:12px 4px;background:#172456;color:white;border:2px solid #7180a2;cursor:pointer}.params button.selected{border-color:#fbd057;background:#314b7c}.controls{display:flex;justify-content:space-between;align-items:center;margin-top:18px;color:#1a2134}.keys{display:flex;gap:8px;flex-wrap:wrap}.keys button{background:#4a5571;color:white;border:2px solid #8b94a5;border-radius:6px;padding:12px;cursor:pointer}.knob{width:100px;height:100px;border-radius:50%;border:10px solid #59677e;background:radial-gradient(circle at 35% 28%,#f5f7f8,#818a9a 70%);box-shadow:0 3px 12px #333;cursor:pointer;position:relative}.knob:after{content:'';position:absolute;width:8px;height:21px;background:#2d3c57;top:8px;left:36px;border-radius:5px}.hint{font-size:12px;color:#46516b;text-align:center}.warning{color:#e4b856;text-align:center;margin:12px}
</style>
<div class="device"><div class="brand">neumovent <small>GraphNet advance · Educational reconstruction</small></div>
<div class="display"><div class="metrics"><span>Ppeak <b id="peak">24</b></span><span>VTe <b id="vte">450</b></span><span>f <b id="freq">14</b></span><span>FiO₂ <b id="fio">40</b>%</span></div>
<div class="middle"><div class="waves"><div class="plot"><label>Paw (cmH₂O)</label><canvas id="p"></canvas></div><div class="plot"><label>VT (L)</label><canvas id="v"></canvas></div><div class="plot"><label>V̇ (L/min)</label><canvas id="f"></canvas></div></div><div class="menu"><h3 id="heading">Ventilation Modes</h3><div id="choices"></div><p id="status">Select a mode, then press control knob to confirm.</p></div></div>
<div class="params" id="params"></div></div>
<div class="controls"><div class="keys"><button onclick="showMenu('Mode')">Mode</button><button onclick="showMenu('Tools')">Tools</button><button onclick="showMenu('Alarms')">Alarms</button><button onclick="showMenu('Graphics')">Graphics</button><button onclick="paused=!paused">Freeze</button></div><div><div class="knob" id="knob" title="Wheel to adjust; click to confirm"></div><div class="hint">Scroll / drag to adjust<br>Click to confirm</div></div></div>
</div><p class="warning">Training demonstration only · Not a clinical device or validated physiological model.</p>
<script>
const settings={Mode:'PCV',Ti:1.0,'I:E':'1:2',f:14,PEEP:5,Sens:2,Oxygen:40,'Rise Time':0.2,VT:450};const limits={Ti:[.2,4,.1],f:[4,60,1],PEEP:[0,30,1],Sens:[.5,10,.5],Oxygen:[21,100,1],'Rise Time':[.1,2,.1],VT:[100,1000,10]};let selected='PEEP',pending='PCV',menu='Mode',paused=false,t=0,dragY=null;
const modes=['VCV','PCV','SIMV','PSV','CPAP','PRVC','APRV'];const tools=['Autoscale','Suction configuration','Calibrations','Settings','Time of use and soft version'];
function showMenu(m){menu=m;document.getElementById('heading').textContent=({Mode:'Ventilation Modes',Tools:'Tools',Alarms:'Alarms',Graphics:'Graphics'})[m];const choices=m==='Mode'?modes:m==='Tools'?tools:m==='Alarms'?['High pressure','Low pressure','Apnea','Low minute volume']:['Three curves','Five curves','Loops'];document.getElementById('choices').innerHTML=choices.map(x=>'<button class="'+(x===pending?'active':'')+'" data-choice="'+x+'">'+x+'</button>').join('');document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{pending=b.dataset.choice;showMenu(m)});document.getElementById('status').textContent='Press control knob to confirm selection.'}
function drawParams(){document.getElementById('params').innerHTML=Object.entries(settings).map(([k,v])=>'<button data-param="'+k+'" class="'+(selected===k?'selected':'')+'">'+k+'<br><b>'+v+'</b></button>').join('');document.querySelectorAll('[data-param]').forEach(b=>b.onclick=()=>{selected=b.dataset.param;drawParams()})}
function adjust(d){if(menu==='Mode'&&selected==='Mode'){const i=modes.indexOf(pending);pending=modes[(i+d+modes.length)%modes.length];showMenu(menu);return}const l=limits[selected];if(!l)return;settings[selected]=Math.min(l[1],Math.max(l[0],Math.round((settings[selected]+d*l[2])*100)/100));drawParams()}
function confirm(){if(menu==='Mode'&&pending&&modes.includes(pending)){settings.Mode=pending;document.getElementById('status').textContent='Mode selected: '+pending;drawParams()}else document.getElementById('status').textContent=selected+' = '+settings[selected]+' confirmed.'}
const knob=document.getElementById('knob');knob.addEventListener('wheel',e=>{e.preventDefault();adjust(e.deltaY<0?1:-1)},{passive:false});knob.addEventListener('pointerdown',e=>{dragY=e.clientY;knob.setPointerCapture(e.pointerId)});knob.addEventListener('pointermove',e=>{if(dragY===null)return;const delta=dragY-e.clientY;if(Math.abs(delta)>8){adjust(Math.sign(delta));dragY=e.clientY}});knob.addEventListener('pointerup',()=>{if(dragY!==null){dragY=null;confirm()}});knob.addEventListener('click',confirm);
function plot(id,fn){const c=document.getElementById(id),ctx=c.getContext('2d'),w=c.width=c.clientWidth*devicePixelRatio,h=c.height=c.clientHeight*devicePixelRatio;ctx.clearRect(0,0,w,h);ctx.strokeStyle='#203061';ctx.lineWidth=1;for(let i=1;i<6;i++){ctx.beginPath();ctx.moveTo(i*w/6,0);ctx.lineTo(i*w/6,h);ctx.stroke()}ctx.strokeStyle='#54ef73';ctx.lineWidth=2*devicePixelRatio;ctx.beginPath();for(let x=0;x<w;x+=2){let ph=((x/w*2.8+t*.13)%1+1)%1;let y=fn(ph);if(x===0)ctx.moveTo(x,h*(1-y));else ctx.lineTo(x,h*(1-y))}ctx.stroke()}
function frame(){if(!paused)t+=.025;let insp=Math.max(.1,Math.min(.7,settings.Ti*settings.f/60));plot('p',q=>q<insp?.25+.45*Math.sin(Math.PI*q/insp):.25);plot('v',q=>q<insp?.1+.8*q/insp:.1+.8*Math.exp(-(q-insp)*5));plot('f',q=>q<insp?.5+.35*Math.sin(Math.PI*q/insp):.5-.3*Math.exp(-(q-insp)*6));document.getElementById('peak').textContent=Math.round(15+settings.PEEP+settings.VT/100);document.getElementById('vte').textContent=settings.VT;document.getElementById('freq').textContent=settings.f;document.getElementById('fio').textContent=settings.Oxygen;requestAnimationFrame(frame)}drawParams();showMenu('Mode');frame();
</script></html>
